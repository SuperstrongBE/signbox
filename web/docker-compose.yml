# SignBox companion web — deployed by .github/workflows/deploy.yml on a
# `release/x.x.x` tag, to its OWN dedicated host.
#
# The container is Caddy: it serves the built SPA AND terminates TLS, owning
# :80/:443 directly. No external reverse proxy — this box only runs signbox.
# Caddy provisions the Let's Encrypt certificate for $DOMAIN automatically;
# the `caddy_data` volume persists it across redeploys (so we don't re-issue
# and hit Let's Encrypt rate limits on every deploy).
#
# Prereqs on the host: Docker + ports 80/443 open, and the DNS A record of
# $DOMAIN pointing here.
name: signbox

services:
  web:
    build: .
    image: signbox-web:latest
    container_name: signbox-web
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-signbox.rockerone.io}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
