# SignBox companion web — deployed by .github/workflows/deploy.yml on a
# `release/x.x.x` tag.
#
# Fronted by the SHARED Caddy on this host (the one that already owns :80/:443
# for the other sites). That Caddy reaches this container by name over the
# external `rockerone-edge` network, so its vhost is just:
#     signbox.rockerone.io { reverse_proxy signbox-web:80 }
#
# One-time host setup (idempotent), needed before the first deploy:
#     docker network create rockerone-edge
#
# The `127.0.0.1:8085:80` publish is kept for local debugging only
# (`curl localhost:8085`); the public path is Caddy → signbox-web:80.
name: signbox

networks:
  # Created once on the host; shared with the Caddy container's compose project.
  rockerone-edge:
    external: true

services:
  web:
    build: .
    image: signbox-web:latest
    container_name: signbox-web
    restart: unless-stopped
    networks:
      - rockerone-edge
    ports:
      - "127.0.0.1:8085:80"
